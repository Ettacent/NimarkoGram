apply plugin: 'com.android.application'

// Opt-in size-audit build. Keep the production path unchanged until the
// resulting resource/R8 reports have been reviewed for plugin compatibility.
def nimarkoCompactStandalone = project.hasProperty('ngCompactStandalone')

repositories {
    mavenCentral()
    google()
}

configurations {
    compile.exclude module: 'support-v4'
}

configurations.all {
    exclude group: 'com.google.firebase', module: 'firebase-core'
    exclude group: 'androidx.recyclerview', module: 'recyclerview'
}

dependencies {
    implementation project(':TMessagesProj')
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.core:core:1.16.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation files('../TMessagesProj/libs/libgsaverification-client.aar')
}

android {
    compileSdkVersion 36
    buildToolsVersion '36.0.0'
    // Keep the application and native library modules on the same installed
    // toolchain. A mismatched/missing NDK made AGP package unstripped JNI
    // libraries and silently inflated standalone APKs.
    ndkVersion "26.3.11579264"

    defaultConfig.applicationId = APP_PACKAGE

    sourceSets.main.jniLibs.srcDirs = ['../TMessagesProj/jni/']

    lintOptions {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
        disable 'BlockedPrivateApi'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8

        coreLibraryDesugaringEnabled true
    }

    androidResources {
        localeFilters += ["en", "ar", "de", "es", "it", "ko", "nl", "pt-rBR", "ru", "uk"]
    }

    signingConfigs {
        debug {
            storeFile file("../TMessagesProj/config/release.keystore")
            storePassword RELEASE_STORE_PASSWORD
            keyAlias RELEASE_KEY_ALIAS
            keyPassword RELEASE_KEY_PASSWORD
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing false
        }

        release {
            storeFile file("../TMessagesProj/config/release.keystore")
            storePassword RELEASE_STORE_PASSWORD
            keyAlias RELEASE_KEY_ALIAS
            keyPassword RELEASE_KEY_PASSWORD
            // Sign with ALL APK signature schemes (v1 JAR + v2 + v3 + v3.1)
            // so Android stops prompting "additional APK verification" on
            // install. v2-only was the previous behaviour and triggered the
            // Play Protect / "Verify before install" sheet on modern Androids.
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing false
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
            signingConfig signingConfigs.debug
            // NimarkoGram: ".web" suffix dropped permanently from vc6934.
            // Clean package 'app.nimarkogram.messenger' (the ".web" suffix
            // was a hybrid-app malware pattern signal for Play Protect's
            // package classifier in mid-2026 — contributing to hard-blocks).
            minifyEnabled false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../TMessagesProj/proguard-rules.pro', '../TMessagesProj/proguard-rules-beta.pro'
            ndk.debugSymbolLevel = 'FULL'
        }
        standalone {
            matchingFallbacks = ['release']
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.release
            // NimarkoGram: ".web" suffix dropped (see comment in debug block).
            // The normal standalone artifact remains plugins-friendly. Passing
            // -PngCompactStandalone enables an isolated, measurable experiment
            // with app-level R8 and resource shrinking; it is never implicit.
            minifyEnabled nimarkoCompactStandalone
            shrinkResources nimarkoCompactStandalone
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
        }
    }

    // NimarkoGram: rebrand the published applicationId for this variant only.
    // Upstream TG namespace ('org.telegram.messenger') stays intact for compatibility
    // (TG core references it everywhere — renaming the whole package is out of scope).
    // Final ids (no ".web" suffix anymore — see buildTypes comments):
    //   debug      -> app.nimarkogram.messenger
    //   standalone -> app.nimarkogram.messenger
    defaultConfig.applicationId = 'app.nimarkogram.messenger'

    sourceSets.debug {
        manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_standalone.xml'
    }
    sourceSets.standalone {
        manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_standalone.xml'
    }

    flavorDimensions "minApi"

    productFlavors {
        afat {
            ndk {
                // Hybrid ARM-only APK covering 64-bit and 32-bit ARM devices.
                abiFilters "arm64-v8a", "armeabi-v7a"
            }
            ext {
                abiVersionCode = 2
            }
            sourceSets.standalone {
                manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_standalone.xml'
            }
        }
    }

    defaultConfig.versionCode = Integer.parseInt(APP_VERSION_CODE)

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "app.apk"
            output.versionCodeOverride = defaultConfig.versionCode * 10 + variant.productFlavors.get(0).abiVersionCode
        }
    }

    variantFilter { variant ->
        def names = variant.flavors*.name
        if (variant.buildType.name != "release" && !names.contains("afat")) {
            setIgnore(true)
        }
    }

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 35
        versionName APP_VERSION_NAME

        multiDexEnabled true

        vectorDrawables.generatedDensities = ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi']

        externalNativeBuild {
            cmake {
                version '3.22.1'
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-24' //, '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }
    namespace 'org.telegram.messenger.web'

    lintOptions {
        checkReleaseBuilds false
    }
}

// NimarkoGram: dedicated Firebase project for app.nimarkogram.messenger
// (project_id=nimarkogram-3a6f7) — the google-services.json next to this
// build.gradle holds the matching client config. Without this plugin enabled
// the FirebaseApp wouldn't initialise at runtime and FCM tokens never get
// registered → push notifications silently never arrive in background. See
// also the same JSON copied into TMessagesProj/ so the base manifest resolves.
apply plugin: 'com.google.gms.google-services'
