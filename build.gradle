// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        mavenCentral()
        google()
        maven { url 'https://developer.huawei.com/repo/' }
        maven { url 'https://chaquo.com/maven' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath 'com.google.gms:google-services:4.5.0'
        classpath 'com.huawei.agconnect:agcp:1.9.1.301'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.8'
        // NimarkoGram additions: Kotlin + Chaquopy (Python interop) for ported extera modules.
        // Note: kotlin-gradle-plugin pinned at 1.9.0 to match TMessagesProj kotlin-stdlib version.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0'
        // Chaquopy 17 is required for production support of Android devices
        // using 16 KB memory pages.
        classpath 'com.chaquo.python:gradle:17.0.0'
    }
}
repositories {
    google()
    mavenCentral()
    maven { url 'https://chaquo.com/maven' }
    maven { url 'https://jitpack.io' }
}
def nimarkoPrivateProperties = new Properties()
def nimarkoPrivateFile = rootProject.file('private.properties')
if (nimarkoPrivateFile.exists()) {
    nimarkoPrivateFile.withInputStream { nimarkoPrivateProperties.load(it) }
}
ext.nimarkoBuildValue = { String name, String fallback = '' ->
    def value = providers.gradleProperty(name).orNull
    if (value == null) value = System.getenv(name)
    if (value == null) value = nimarkoPrivateProperties.getProperty(name)
    return value == null ? fallback : value.toString()
}
def nimarkoSigning = ['RELEASE_STORE_FILE', 'RELEASE_STORE_PASSWORD', 'RELEASE_KEY_ALIAS', 'RELEASE_KEY_PASSWORD']
        .collectEntries { name -> [(name): rootProject.ext.nimarkoBuildValue(name)] }
def nimarkoSigningConfigured = nimarkoSigning.values().every { !it.isEmpty() }
if (!nimarkoSigningConfigured && nimarkoSigning.values().any { !it.isEmpty() }) {
    throw new GradleException('Release signing requires RELEASE_STORE_FILE, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS and RELEASE_KEY_PASSWORD together')
}
allprojects {
    ext.nimarkoReleaseSigningConfigured = nimarkoSigningConfigured
    ext.nimarkoSigning = nimarkoSigning
    ext.nimarkoFirebaseEnabled = rootProject.ext.nimarkoBuildValue('NIMARKO_FIREBASE_ENABLED', file('google-services.json').isFile().toString()).toBoolean()
    ext.nimarkoCrashlyticsUploadEnabled = nimarkoFirebaseEnabled && rootProject.ext.nimarkoBuildValue('NIMARKO_CRASHLYTICS_UPLOAD', 'false').toBoolean()
    plugins.withId('com.android.application') {
        android.defaultConfig.manifestPlaceholders['GOOGLE_MAPS_API_KEY'] = rootProject.ext.nimarkoBuildValue('GOOGLE_MAPS_API_KEY')
    }
    plugins.withId('com.google.firebase.crashlytics') {
        android.buildTypes.configureEach {
            firebaseCrashlytics {
                mappingFileUploadEnabled nimarkoCrashlyticsUploadEnabled
                nativeSymbolUploadEnabled nimarkoCrashlyticsUploadEnabled
            }
        }
    }
    configurations.configureEach {
        resolutionStrategy.dependencySubstitution {
            ['common', 'container', 'muxer'].each { mediaModule ->
                substitute module("androidx.media3:media3-${mediaModule}") using project(":TMessagesProj_Modules:media3:media-lib-${mediaModule}")
            }
        }
    }
    repositories {
        google()
        mavenCentral()
        maven { url 'https://chaquo.com/maven' }
        maven { url 'https://jitpack.io' }
    }

    if (project.projectDir.absolutePath.contains('/TMessagesProj_Modules/media/')) {
        project.plugins.withId('com.android.library') {
            project.android {
                if (namespace == null) {
                    def manifestFile = file("${project.projectDir}/src/main/AndroidManifest.xml")

                    if (manifestFile.exists()) {
                        def manifest = new XmlSlurper().parse(manifestFile)
                        def manifestPackage = manifest.@package.text()

                        if (manifestPackage) {
                            namespace manifestPackage
                        }
                    }
                }
            }
        }
    }
}
