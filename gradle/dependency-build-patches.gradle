import java.nio.channels.OverlappingFileLockException
import java.util.concurrent.TimeUnit

def dependencies = [
    ['TMessagesProj_Modules/media', '09b6c97c0d691c50cd4541e1573995d4066d6f5c', 'media-build-configuration.patch'],
    ['TMessagesProj/lib/jlatexmath', '919e50b2f6f64b04b712cdb13d558ff9ecf9c8ed', 'jlatex-build-configuration.patch']
]

dependencies.each { dependency ->
    def directory = new File(settingsDir, dependency[0])
    def patch = new File(settingsDir, 'patches/' + dependency[2])
    def lockFile = new File(settingsDir, '.gradle/' + dependency[2] + '.lock')
    lockFile.parentFile.mkdirs()
    def git = { List<String> arguments ->
        def process = new ProcessBuilder(['git', '-C', directory.absolutePath] + arguments).redirectErrorStream(true).start()
        def output = new StringBuffer()
        def reader = process.consumeProcessOutputStream(output)
        if (!process.waitFor(30, TimeUnit.SECONDS)) {
            process.destroyForcibly()
            reader.join(1000)
            throw new GradleException('Dependency build patch timed out: ' + dependency[0])
        }
        reader.join(1000)
        [process.exitValue(), output.toString()]
    }
    new RandomAccessFile(lockFile, 'rw').withCloseable { handle ->
        def channel = handle.channel
        def lock = null
        def deadline = System.nanoTime() + 120_000_000_000L
        while (lock == null) {
            try {
                lock = channel.tryLock()
            } catch (OverlappingFileLockException ignored) {
            }
            if (lock == null) {
                if (System.nanoTime() >= deadline) {
                    throw new GradleException('Dependency build patch lock timed out: ' + dependency[0])
                }
                Thread.sleep(50)
            }
        }
        try {
            def head = git(['rev-parse', 'HEAD'])
            if (head[0] != 0 || head[1].trim() != dependency[1] || !patch.isFile()) {
                throw new GradleException('Dependency build patch prerequisites do not match: ' + dependency[0])
            }
            if (git(['apply', '--reverse', '--check', patch.absolutePath])[0] != 0) {
                if (git(['apply', '--check', patch.absolutePath])[0] != 0 ||
                        git(['apply', patch.absolutePath])[0] != 0 ||
                        git(['apply', '--reverse', '--check', patch.absolutePath])[0] != 0) {
                    throw new GradleException('Dependency build patch conflicts with working source: ' + dependency[0])
                }
            }
        } finally {
            lock.release()
        }
    }
}
