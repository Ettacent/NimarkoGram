import org.gradle.nativeplatform.platform.internal.DefaultNativePlatform

apply plugin: 'com.android.library'
// NimarkoGram additions for ported extera (Kotlin + Python interop).
// kotlin-kapt removed: Room *_Impl.java files were pre-generated during decompile,
// so we don't need RoomProcessor at compile time.
apply plugin: 'kotlin-android'
apply plugin: 'com.chaquo.python'
apply plugin: 'org.telegram.lottie-meta'
apply plugin: 'idea'

idea {
    module {
        excludeDirs += [
            file('jni/third_party'),
            file('jni/ffmpeg'),
            file('jni/tlottie'),
            file('jni/boringssl'),
            file('jni/sqlite')
        ]
    }
}

repositories {
    mavenCentral()
    google()
    maven { url 'https://chaquo.com/maven' }
}

configurations {
    compile.exclude module: 'support-v4'
}

configurations.all {
    exclude group: 'com.google.firebase', module: 'firebase-core'
    exclude group: 'androidx.recyclerview', module: 'recyclerview'
}

dependencies {
    implementation 'androidx.core:core:1.16.0'
    // Material Components — exteraGram bundles this (v1.13.0); plugins reflect widgets like
    // com.google.android.material.progressindicator.CircularProgressIndicator via Chaquopy jclass.
    // AppCompat theme is sufficient (ProgressIndicator styles don't set enforceMaterialTheme).
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.palette:palette:1.0.0'
    implementation 'com.caverock:androidsvg-aar:1.4'   // renders custom .icons pack SVGs (viewBox offset / <g transform>) like exteraGram
    implementation 'androidx.exifinterface:exifinterface:1.3.6'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    implementation "androidx.sharetarget:sharetarget:1.2.0"
    implementation 'androidx.interpolator:interpolator:1.0.0'
    implementation 'androidx.biometric:biometric:1.1.0'

    implementation 'com.google.android.gms:play-services-cast-framework:21.4.0'
    implementation "androidx.mediarouter:mediarouter:1.7.0"
    implementation 'com.google.zxing:core:3.5.4'

    implementation 'androidx.car.app:app:1.4.0'
    implementation 'androidx.car.app:app-projected:1.4.0'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    compileOnly 'org.checkerframework:checker-qual:2.5.2'
    compileOnly 'org.checkerframework:checker-compat-qual:2.5.0'
    implementation 'com.google.firebase:firebase-messaging:22.0.0'
    implementation 'com.google.firebase:firebase-datatransport:18.1.0'
    implementation 'com.google.firebase:firebase-appindexing:20.0.0'
    implementation 'com.google.android.gms:play-services-maps:18.1.0'
    implementation 'com.google.android.gms:play-services-auth:20.4.0'
    implementation 'com.google.android.gms:play-services-vision:20.1.3'
    implementation 'com.google.android.gms:play-services-wearable:18.0.0'
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation 'com.google.android.gms:play-services-wallet:19.1.0'
    implementation 'com.googlecode.mp4parser:isoparser:1.0.6'
    implementation 'com.stripe:stripe-android:2.0.2'
    implementation 'com.google.mlkit:language-id:17.0.6'
    implementation 'com.android.billingclient:billing:7.1.1'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.google.guava:guava:31.1-android'
    implementation 'com.google.android.play:integrity:1.3.0'
    implementation 'com.google.android.gms:play-services-safetynet:18.0.1'

    implementation 'com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1'
    implementation 'com.google.android.gms:play-services-mlkit-image-labeling:16.0.8'

    implementation "androidx.credentials:credentials:1.6.0-alpha04"
    implementation "androidx.credentials:credentials-play-services-auth:1.6.0-alpha04"

    implementation "io.noties.markwon:core:4.6.2"
    implementation "io.noties.markwon:ext-strikethrough:4.6.2"
    implementation "io.noties.markwon:ext-tables:4.6.2"
    implementation "io.noties.markwon:html:4.6.2"
    implementation "io.noties.markwon:inline-parser:4.6.2"
    implementation("io.noties.markwon:ext-latex:4.6.2") {
        exclude group: 'ru.noties', module: 'jlatexmath-android'
    }
    api project(':jlatexmath')

//    implementation 'com.google.mlkit:translate:17.0.3'

    constraints {
        // NimarkoGram: bumped 1.8.0 -> 1.9.0 to align with kotlin-gradle-plugin 1.9.0.
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.0") {
            because("kotlin-stdlib-jdk7 is now a part of kotlin-stdlib")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.0") {
            because("kotlin-stdlib-jdk8 is now a part of kotlin-stdlib")
        }
    }
    implementation 'com.google.android.recaptcha:recaptcha:18.7.1'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    // ---- NimarkoGram (ported extera) ----
    // Kotlin stdlib pinned to 1.9.0 (matches buildscript classpath).
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.0'
    // Pine xposed-style hooks (used by extera plugins.xposed). We keep the 0.3.0 AAR for its Java classes,
    // Pine hook engine, rebuilt from canyie/pine @0.3.0 sources (see /root/pine-build) instead of the maven AAR
    // for TWO reasons: (1) 16KB-page alignment — the stock 0.3.0 .so is 4KB-aligned and fails to load on
    // 16KB-page Android 15/16 devices, crashing the plugin engine; our jni/<abi>/libpine.so is built with
    // -Wl,-z,max-page-size=16384. (2) A Java-side guard in Pine.handleCall that turns Pine 0.3.0's arm64
    // receiver/arg mis-read (Method.invoke "Expected receiver of type X, but got byte[]" during a draw hook)
    // from a hard UI-thread crash into a skipped call with a default result. The patched classes ship in
    // libs/pine-core-16kb.jar; the matching 16KB .so is in jni/ (packagingOptions.pickFirst below). Same public
    // ABI, so the ColorOS trampoline guards in PineAdapter/XposedBridge are unaffected.
    implementation files('libs/pine-core-16kb.jar')
    // LSPosed HiddenApiBypass — Pine.disableHiddenApiPolicy does NOT cover
    // Chaquopy's JNI-based constructor enumeration on Android 13+: the
    // protected @hide Intent(Parcel) ctor still gets resolved by the
    // reflection cache and triggers NoSuchMethodError during overload-pick.
    // setHiddenApiExemptions("L") permits all @hide APIs regardless of the
    // calling domain, restoring constructor enumeration for plugins.
    // 6.1 is the current stable implementation. Unlike the old 4.3 build it
    // includes the latest ART/Unsafe compatibility fixes used on Android 15/16.
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.1'
    // NimarkoGram: pine:enhances:0.1.0 not on mavenCentral — dropped (extera plugins.xposed will reflect on core only).
    // MVEL expression engine (extera plugins engine).
    implementation 'org.mvel:mvel2:2.5.2.Final'
    // Coil for NowPlaying album-art async loading.
    implementation 'io.coil-kt:coil:2.5.0'
    // Gson — extera api uses it heavily. Note: TG already pulls gson 2.11.0;
    // explicit pin keeps extera api/dto contract stable at 2.10.1 semantics.
    implementation 'com.google.code.gson:gson:2.10.1'
    // Jackson — NimarkoJsonBottomSheet's "Switch to Jackson" toggle uses ObjectMapper
    // for pretty-printing the TLRPC.Message when NimarkoConfig.jacksonJSON_Provider
    // is on (default off). Mirrors CG's JsonBottomSheet behaviour.
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    // Room — extera api/db. (kapt processor disabled; we use the pre-generated *_Impl.java.)
    // Note: 2.7.0+ for SQLiteConnection / EntityInsertAdapter API surface used by ported _Impl files.
    implementation 'androidx.room:room-runtime:2.7.0'
    implementation 'androidx.sqlite:sqlite:2.5.0'

    // ---- NimarkoGram Phase 2 (re-port: restored 144 extera files) ----
    // Retrofit (extera api/network/ApiService is a Retrofit interface).
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    // OkHttp logging interceptor (ported network code references it).
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    // LinkedIn DexMaker (extera plugins/utils/ClassProxy uses com.android.dx.* for runtime dex gen;
    // dexmaker repackages those classes under the same com.android.dx namespace).
    implementation 'com.linkedin.dexmaker:dexmaker:2.28.3'
    // kotlinx coroutines (many ported kotlin classes use them).
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    // kotlinx serialization (some api/dto files use it).
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.0'
    // WorkManager (extera api/worker/SyncWorker).
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // ---- NimarkoGram CameraX backend ----
    // Keep every CameraX artifact on the same stable release. Concurrent
    // controllers are bound while inactive and activated only after the full
    // pair is registered, which is required for eager OEM camera services.
    def camerax_version = '1.6.1'
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-video:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"

}

android {
    compileSdkVersion 36
    buildToolsVersion '36.0.0'
    ndkVersion "26.3.11579264"

    sourceSets.main.jniLibs.srcDirs = ['./jni/']

    // Our 16KB-aligned jni/<abi>/libpine.so wins over the 4KB one bundled in the Pine 0.3.0 AAR.
    packagingOptions {
        pickFirst 'lib/**/libpine.so'
    }

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
        }
    }

    lintOptions {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
        disable 'BlockedPrivateApi'
    }

    compileOptions {
        // NimarkoGram: bumped 1.8 -> 17 to match kotlinOptions jvmTarget (extera Kotlin code).
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17

        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
        // NG: suppress Kotlin metadata version-check errors from transitive
        // dependencies (androidx.credentials-1.6.0-alpha04, recaptcha-18.7.1)
        // which ship with Kotlin 2.1.0 metadata. NG uses Kotlin 1.9.0 — the
        // older compiler can't READ the newer metadata blocks but the actual
        // bytecode is JVM-17 compatible. -Xskip-metadata-version-check tells
        // kotlinc to treat unreadable metadata as opaque rather than erroring.
        freeCompilerArgs += '-Xskip-metadata-version-check'
    }


    defaultConfig {
        // NimarkoGram: lowered to 23 so apksigner verifies v1 (>=24 spec
        // skips v1 entirely → Play Protect treated APK as "modern-only"
        // and hard-blocked on Android 16). Chaquopy minSdk note was a
        // soft preference; actual native libs work on 23 fine.
        minSdkVersion 24
        targetSdkVersion 35

        // NimarkoGram: hybrid — build BOTH arm64-v8a (modern) AND armeabi-v7a (old devices) so a
        // single APK runs everywhere. CMake compiles the full native set for each ABI; prebuilt
        // static libs (ffmpeg/boringssl/tde2e) ship both. (Was arm64-only.)
        ndk {
            // Fast dev iteration: pass -PngArm64Only to build arm64-v8a alone (skips the armeabi-v7a
            // native pass, ~halving CMake time). Release stays hybrid for old-device coverage.
            if (project.hasProperty('ngArm64Only')) {
                abiFilters 'arm64-v8a'
            } else {
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }

        vectorDrawables.generatedDensities = ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi']

        multiDexEnabled true

        externalNativeBuild {
            cmake {
                version '3.22.1'
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-24' //, '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
            }
        }
    }

    buildTypes {
        debug {
            jniDebuggable true
            minifyEnabled false
            shrinkResources false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../TMessagesProj/proguard-rules.pro', '../TMessagesProj/proguard-rules-beta.pro'
            ndk.debugSymbolLevel = 'FULL'
            buildConfigField "String", "BUILD_VERSION_STRING", "\"" + APP_VERSION_NAME + "\""
            buildConfigField "String", "APP_CENTER_HASH", "\"\""
            buildConfigField "String", "BETA_URL", "\"" + getProps("BETA_PRIVATE_URL") + "\""
            buildConfigField "boolean", "DEBUG_VERSION", "true"
            buildConfigField "boolean", "DEBUG_PRIVATE_VERSION", "true"
            buildConfigField "boolean", "BUNDLE", "false"
            buildConfigField "int", "VERSION_NUM", "0"
        }

        HA_private {
            matchingFallbacks = ['release']
            jniDebuggable false
            minifyEnabled true
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../TMessagesProj/proguard-rules.pro', '../TMessagesProj/proguard-rules-beta.pro'
            ndk.debugSymbolLevel = 'FULL'
            buildConfigField "String", "BUILD_VERSION_STRING", "\"" + APP_VERSION_NAME + "\""
            buildConfigField "String", "APP_CENTER_HASH", "\"" + getProps("APP_CENTER_HASH_PRIVATE") + "\""
            buildConfigField "String", "BETA_URL", "\"" + getProps("BETA_PRIVATE_URL") + "\""
            buildConfigField "boolean", "DEBUG_VERSION", "true"
            buildConfigField "boolean", "DEBUG_PRIVATE_VERSION", "true"
            buildConfigField "boolean", "BUNDLE", "false"
            buildConfigField "int", "VERSION_NUM", "1"
        }

        HA_public {
            matchingFallbacks = ['release']
            jniDebuggable false
            minifyEnabled true
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../TMessagesProj/proguard-rules.pro', '../TMessagesProj/proguard-rules-beta.pro'
            ndk.debugSymbolLevel = 'FULL'
            buildConfigField "String", "BUILD_VERSION_STRING", "\"" + APP_VERSION_NAME + "\""
            buildConfigField "String", "APP_CENTER_HASH", "\"" + getProps("APP_CENTER_HASH_PUBLIC") + "\""
            buildConfigField "String", "BETA_URL", "\"" + getProps("BETA_PUBLIC_URL") + "\""
            buildConfigField "boolean", "DEBUG_VERSION", "true"
            buildConfigField "boolean", "DEBUG_PRIVATE_VERSION", "false"
            buildConfigField "boolean", "BUNDLE", "false"
            buildConfigField "int", "VERSION_NUM", "4"
        }

        HA_hardcore {
            matchingFallbacks = ['release']
            jniDebuggable false
            minifyEnabled true
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../TMessagesProj/proguard-rules.pro', '../TMessagesProj/proguard-rules-beta.pro'
            ndk.debugSymbolLevel = 'FULL'
            buildConfigField "String", "BUILD_VERSION_STRING", "\"" + APP_VERSION_NAME + "\""
            buildConfigField "String", "APP_CENTER_HASH", "\"" + getProps("APP_CENTER_HASH_HARDCORE") + "\""
            buildConfigField "String", "BETA_URL", "\"" + getProps("BETA_HARDCORE_URL") + "\""
            buildConfigField "boolean", "DEBUG_VERSION", "true"
            buildConfigField "boolean", "DEBUG_PRIVATE_VERSION", "true"
            buildConfigField "boolean", "BUNDLE", "false"
            buildConfigField "int", "VERSION_NUM", "5"
        }

        standalone {
            matchingFallbacks = ['release']
            jniDebuggable false
            minifyEnabled true
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
            buildConfigField "String", "BUILD_VERSION_STRING", "\"" + APP_VERSION_NAME + "\""
            buildConfigField "String", "APP_CENTER_HASH", "\"\""
            buildConfigField "String", "BETA_URL", "\"\""
            buildConfigField "boolean", "DEBUG_VERSION", "false"
            buildConfigField "boolean", "DEBUG_PRIVATE_VERSION", "false"
            buildConfigField "boolean", "BUNDLE", "false"
            buildConfigField "int", "VERSION_NUM", "6"
        }

        release {
            jniDebuggable false
            minifyEnabled true
            shrinkResources false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
            buildConfigField "String", "BUILD_VERSION_STRING", "\"" + APP_VERSION_NAME + "\""
            buildConfigField "String", "APP_CENTER_HASH", "\"\""
            buildConfigField "String", "BETA_URL", "\"\""
            buildConfigField "boolean", "DEBUG_VERSION", "false"
            buildConfigField "boolean", "DEBUG_PRIVATE_VERSION", "false"
            buildConfigField "boolean", "BUNDLE", "false"
            buildConfigField "int", "VERSION_NUM", "7"
        }
    }

    namespace 'org.telegram.messenger'
}

// Chaquopy reads settings at apply-time, so this block may sit before or
// after the android closure.
chaquopy {
    defaultConfig {
        // Python 3.11 is the newest runtime in this project which supports
        // both release ABIs (arm64-v8a and armeabi-v7a). Python 3.13 would
        // silently make a combined ARM64 + ARMv7 release impossible.
        version = "3.11"
        def nimarkoBuildPython = System.getenv("NIMARKO_BUILD_PYTHON")
        if (!nimarkoBuildPython) {
            nimarkoBuildPython = [
                    "/usr/bin/python3.11",
                    "/usr/local/bin/python3.11",
                    "/opt/nimarko-python-3.11.14/bin/python3.11"
            ].find { file(it).canExecute() }
        }
        buildPython(nimarkoBuildPython ?: "python3.11")
        pip {
            // Higher build-number ARM64 wheels compiled with
            // -Wl,-z,max-page-size=16384. For ARMv7, pip ignores these
            // incompatible wheels and keeps using Chaquopy's official ones.
            options "--find-links", "${project.projectDir}/python-wheels/arm64-v8a"
            install "requests==2.31.0"
            install "certifi"
            install "urllib3"
            install "mpmath"
            install "tinydb"
            // Bundled so plugins can import them without declaring (exteraGram
            // ships these in its runtime, and plugins like UiTweaks do
            // `from packaging.version import Version` / `import humanize`
            // without listing them in __requirements__).
            install "packaging"
            install "humanize"
            install "typing_extensions"
            // Pillow (import name PIL) — exteraGram bundles it; some plugins do
            // `from PIL import ...`. Chaquopy ships prebuilt native wheels for it.
            install "Pillow"
            // Native packages with Chaquopy prebuilt Android wheels. These cannot
            // be installed by the on-device resolver (Chaquopy can't load .so at
            // runtime), so they MUST be bundled here to be importable.
            install "lxml"
            install "numpy==1.26.2"
            install "cryptography==42.0.8"
            install "pycryptodome"
            install "regex==2023.10.3"
            install "PyYAML"
            // Pure-python helpers bundled for convenience so plugins can import
            // them without declaring (and without a network round-trip on install).
            install "beautifulsoup4"
            install "soupsieve"
            install "markupsafe"
            install "mutagen"
        }
    }
}


def getProps(String propName) {
    def propsFile = rootProject.file('local.properties')
    if (propsFile.exists()) {
        def props = new Properties()
        props.load(new FileInputStream(propsFile))
        return props[propName]
    } else {
        return "";
    }
}
// NimarkoGram: google-services plugin intentionally NOT applied on the
// library module. Its namespace is `org.telegram.messenger` (changing that
// would re-package every R.java import across the codebase) which has no
// matching client in our Firebase project nimarkogram-3a6f7. The plugin is
// applied on `:TMessagesProj_AppStandalone` instead — that module's
// applicationId override `app.nimarkogram.messenger` matches our JSON and
// generates the runtime FirebaseApp config the final APK actually uses.
// apply plugin: 'com.google.gms.google-services'

task checkVisibility {
    doFirst {
        def isPrivateBuild = project.gradle.startParameter.taskNames.find {
            it.contains("HA_private") || it.contains("HA_hardcore") || it.contains("Debug") || it.contains("Release")
        }
        def isPublicAllowed = !project.hasProperty("IS_PRIVATE") || !project.property("IS_PRIVATE").toBoolean()
        if (!isPrivateBuild && !isPublicAllowed) {
            throw new GradleException("Building public version of private code!")
        }
    }
    doLast {
        if (project.gradle.startParameter.taskNames.find { it.contains("HA_public") }) {
            def privateBuild = file("${projectDir}_AppHockeyApp/afat/HA_private/Telegram-Beta.apk")
            if (privateBuild.exists()) {
                privateBuild.delete()
            }
        }
    }
}

preBuild.dependsOn checkVisibility
