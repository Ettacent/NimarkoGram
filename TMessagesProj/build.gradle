def isWindows = String.valueOf(DefaultNativePlatform.currentOperatingSystem.toFamilyName() == OperatingSystemFamily.WINDOWS)
def privateValue = rootProject.ext.privateConfig
def configString = rootProject.ext.buildConfigString
def telegramApiId = privateValue('TELEGRAM_API_ID', '0')
if (!telegramApiId.matches('[0-9]+')) {
    telegramApiId = '0'
}

android {
    compileSdkVersion 36
    buildToolsVersion '36.0.0'
    ndkVersion "26.3.11579264"

    sourceSets.main.jniLibs.srcDirs = ['./jni/']

    packagingOptions {
        pickFirst 'lib/**/libpine.so'
    }

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
        }
    }

    lintOptions {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
        disable 'BlockedPrivateApi'
    }

    compileOptions {
        
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17

        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
        
        freeCompilerArgs += '-Xskip-metadata-version-check'
    }

    defaultConfig {
        buildConfigField "int", "TELEGRAM_API_ID", telegramApiId
        buildConfigField "String", "TELEGRAM_API_HASH", configString(privateValue('TELEGRAM_API_HASH'))
        buildConfigField "String", "GOOGLE_AUTH_CLIENT_ID", configString(privateValue('GOOGLE_AUTH_CLIENT_ID'))
        buildConfigField "String", "GOOGLE_SAFETYNET_KEY", configString(privateValue('GOOGLE_SAFETYNET_KEY'))
        buildConfigField "String", "HUAWEI_APP_ID", configString(privateValue('HUAWEI_APP_ID'))
        buildConfigField "String", "NIMARKO_UPDATE_ENDPOINT", configString(privateValue('NIMARKO_UPDATE_ENDPOINT'))
        buildConfigField "String", "NIMARKO_MEDIA_API_URL", configString(privateValue('NIMARKO_MEDIA_API_URL'))
        buildConfigField "String", "NIMARKO_API_BASE_URL", configString(privateValue('NIMARKO_API_BASE_URL'))
        buildConfigField "String", "NIMARKO_BANNER_API_URL", configString(privateValue('NIMARKO_BANNER_API_URL'))
        buildConfigField "String", "NIMARKO_BANNER_PLACEHOLDER_URL", configString(privateValue('NIMARKO_BANNER_PLACEHOLDER_URL'))
        buildConfigField "String", "NIMARKO_INFOCARD_RATES_URL", configString(privateValue('NIMARKO_INFOCARD_RATES_URL'))
        buildConfigField "String", "NIMARKO_ASIA_RELAY_HOST", configString(privateValue('NIMARKO_ASIA_RELAY_HOST'))
        buildConfigField "String", "NIMARKO_SUPPORT_URL", configString(privateValue('NIMARKO_SUPPORT_URL'))
        buildConfigField "String", "NIMARKO_TRUSTED_PLUGIN_IDS", configString(privateValue('NIMARKO_TRUSTED_PLUGIN_IDS'))
        
        minSdkVersion 24
        targetSdkVersion 35

        ndk {
            
