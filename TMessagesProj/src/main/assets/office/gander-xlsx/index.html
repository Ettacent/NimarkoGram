<!doctype html>
<html lang="en" data-office-renderer="gander-xlsx" data-reading-dark="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; worker-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'none'; font-src 'self'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title></title>
<style>
:root{color-scheme:light;--office-desk:#e8e8e8;--office-paper:#fff;--office-ink:#222;--office-accent:#2481cc;--office-accent-ink:#fff;--office-find:#2481cc66;--office-border:#cfd8dc;--office-top:0px;--office-bottom:0px}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:var(--office-desk);font-family:system-ui,sans-serif;overflow-anchor:none;touch-action:pan-x pan-y}
html{scroll-padding-top:calc(var(--office-top) + 1px);scroll-padding-bottom:calc(var(--office-bottom) + 1px)}
html.office-protected,html.office-protected *{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#status{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:var(--office-desk);color:var(--office-ui-ink,var(--office-ink));font-size:14px}
[hidden]{display:none!important}
html[data-reading-dark=true] td[data-office-night~="color"]{color:var(--office-night-color)!important}
html[data-reading-dark=true] td[data-office-night~="background"]{background:var(--office-night-background)!important}
html[data-reading-dark=true] td[data-office-night~="border"]{border:var(--office-night-border)!important}
html[data-reading-dark=true] td[data-office-night~="border-top"]{border-top:var(--office-night-border-top)!important}
html[data-reading-dark=true] td[data-office-night~="border-right"]{border-right:var(--office-night-border-right)!important}
html[data-reading-dark=true] td[data-office-night~="border-bottom"]{border-bottom:var(--office-night-border-bottom)!important}
html[data-reading-dark=true] td[data-office-night~="border-left"]{border-left:var(--office-night-border-left)!important}
</style>
<script type="module" src="./viewer.js"></script>
</head>
<body><main id="viewer"></main><div id="status" role="status">Opening spreadsheet…</div></body>
</html>
